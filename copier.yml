_subdirectory: skeleton
_answers_file: .copier-answers.yml

_exclude:
  # ВНИМАНИЕ: это blacklist, не whitelist (Copier не поддерживает re-include после "*").
  # Новый НЕ-CORE файл в skeleton/ просочится в инстанс, пока не добавлен сюда.
  # После добавления файлов в skeleton — сверяйся с CORE_PATHS (scripts/lib/layers.sh).
  # Готовая проверка обоих условий (CORE доехал, лишнее не протекло): scripts/verify-copier.sh.
  # Руками:
  #   copier copy --vcs-ref HEAD --data project_name=probe --data lang=vue . /tmp/probe \
  #     --defaults --trust && find /tmp/probe -type f
  # `--vcs-ref HEAD` обязателен: без него Copier для git-шаблона рендерит последний ТЕГ, а не
  # текущее состояние, и новых файлов в выводе просто нет. Но и с ним берётся последний
  # КОММИТ — незакоммиченная правка невидима, поэтому verify-copier.sh рендерит одноразовый
  # клон рабочего дерева.
  # Non-CORE skeleton files — template scaffolding
  - "*.template"
  - "lang-packs"
  # `scripts` целиком исключать нельзя: log-append / check-ac-refs / load-context — CORE,
  # на них ссылаются правила и settings.json. Глухое исключение давало пять битых ссылок.
  - ".husky"
  - ".harness.conf.example"

  # Non-CORE .claude subdirs
  - ".claude/docs"
  - ".claude/settings.json.template"
  # Роли-агенты — instance-owned scaffold (ADR-13). Copier их НЕ доставляет ни при init,
  # ни при update: раскатка только явным флагом `bootstrap.sh <имя> <lang> --agents`.
  # Причина — агент завязан на стек и базу знаний проекта (fenris это доказал),
  # форс-синк ломал бы инстанс, а пустой плейсхолдер в каждом репо вреднее явного принятия.
  - ".claude/agents"

  # run-pytest-hook — Python-LANG sensor: доставляем ТОЛЬКО при lang=python (как lang-файлы ниже),
  # а не исключаем глухо. Иначе Python-инстанс ссылается на хук, который синк не привозит.
  - "{% if lang != 'python' %}.claude/guards/run-pytest-hook.sh{% endif %}"

  # md-libs lang file is not a standard LANG pack
  - ".claude/rules/lang/md-libs.md"

  # Exclude each lang file that is NOT the selected lang
  - "{% if lang != 'vue' %}.claude/rules/lang/vue.md{% endif %}"
  - "{% if lang != 'go' %}.claude/rules/lang/go.md{% endif %}"
  - "{% if lang != 'php' %}.claude/rules/lang/php.md{% endif %}"
  - "{% if lang != 'python' %}.claude/rules/lang/python.md{% endif %}"
  - "{% if lang != 'dotnet' %}.claude/rules/lang/dotnet.md{% endif %}"

project_name:
  type: str
  help: Имя проекта-инстанса

lang:
  type: str
  help: Языковой пак
  choices: [vue, go, php, python, dotnet, none]
  default: vue
