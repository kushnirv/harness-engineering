# .harness.conf — конфигурация харнесса этого проекта.
# Читается скриптами в .claude/guards/ и scripts/. Приезжает при первом
# `copier copy`, при `copier update` НЕ перезаписывается (файл твой).
#
# Стартовое состояние — полный fail-open: команды пусты → sensor и gate молчат,
# работают только guard (readonly-зоны) и nudge. Заполняй по мере появления стека.
#
# ВАЖНО: значения в форме ${VAR:-default}, не VAR=default. Это осознанно:
# sensor-диспетчер (.claude/guards/sensor.sh) передаёт переменные дочернему хуку
# через env, а хук сорсит этот файл поверх — голое присваивание затёрло бы env.

# --- Sensor (PostToolUse: тесты на каждую правку) ---

# Диспетчер сам находит корень воркспейса подъёмом от изменённого файла до
# ближайшего манифеста (package.json / pyproject.toml). Обычный проект → корень
# репы, монорепа → своё приложение. *_WORKDIR заполняй только если раскладка
# нестандартная: явное значение отключает автоопределение.

# JS/TS (*.ts *.tsx *.js *.jsx *.vue). Пусто → молчим.
# Включить: JS_TEST_CMD="npx vitest related --run"   (jest: "npx jest --findRelatedTests")
JS_TEST_CMD="${JS_TEST_CMD:-}"
JS_WATCH_DIR="${JS_WATCH_DIR:-}"
JS_TEST_WORKDIR="${JS_TEST_WORKDIR:-}"

# Python (*.py). Пусто → молчим.
# Включить: PY_TEST_CMD="uv run pytest -q"   (без uv: "pytest -q")
PY_TEST_CMD="${PY_TEST_CMD:-}"
PY_WATCH_DIR="${PY_WATCH_DIR:-}"
PY_TEST_WORKDIR="${PY_TEST_WORKDIR:-}"
# testmon — выбор тестов по графу зависимостей (нужен pytest-testmon)
# map     — исходник foo.py → парный tests/test_foo.py; не найден → молчим
PYTEST_MODE="${PYTEST_MODE:-map}"

# Legacy-переменные одностековых конфигов. Диспетчер использует их как фолбэк
# для JS-ветки, когда JS_* не заданы. В новых проектах — не трогать.
WATCH_DIR="${WATCH_DIR:-}"
TEST_CMD="${TEST_CMD:-}"
TEST_WORKDIR="${TEST_WORKDIR:-}"

# --- Guard (PreToolUse: запрет записи в сгенерированное) ---

# Пробел-разделённый список. Матчится полный сегмент пути: "dist" ловит и
# apps/web/dist, и packages/ui/dist. block-zones.sh вернёт exit 2 при записи.
READONLY_ZONES="${READONLY_ZONES:-dist build node_modules .next .turbo __pycache__ .pytest_cache .mypy_cache .ruff_cache .venv .egg-info coverage}"

# --- Gate (Stop: repo-wide проверка на конце хода, Ярус 2) ---

# БЕЗ полных тестов (их закрывает sensor пофайлово). Пусто → gate выключен.
#   node:   GATE_CMD="npm run type-check && npm run lint && npm run build"
#   python: GATE_CMD="uv run ruff check . && uv run mypy ."
#   оба:    склей && обеими половинами
GATE_CMD="${GATE_CMD:-}"

# Ярус 3 (только pre-push): полные тесты поверх GATE_CMD. Пусто → пропустить.
#   GATE_TEST_CMD="npm run test && (cd api && uv run pytest)"
GATE_TEST_CMD="${GATE_TEST_CMD:-}"

# Откуда запускать GATE_CMD (по умолчанию корень репы).
GATE_WORKDIR="${GATE_WORKDIR:-}"

# --- Memory ---

# Долгосрочная память (вики): load-context.sh грузит overview.md + хвост log.md
# на SessionStart. Пусто → пропускается.
WIKI_PATH="${WIKI_PATH:-}"

# --- Repo ---

REPO_ROOT="${REPO_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}"
